<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0 4px;
  }

  .score {
    font-size: 22px;
    font-weight: 700;
    color: #4ade80;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
  }

  .high-score {
    font-size: 14px;
    color: #666;
    letter-spacing: 0.5px;
  }

  .high-score span {
    color: #facc15;
    font-weight: 600;
  }

  canvas {
    border-radius: 8px;
    box-shadow:
      0 0 0 2px #1a1a2e,
      0 0 0 4px #16213e,
      0 0 40px rgba(74, 222, 128, 0.08);
  }

  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 8px;
    backdrop-filter: blur(4px);
    transition: opacity 0.3s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay h1 {
    font-size: 42px;
    color: #4ade80;
    margin-bottom: 8px;
    text-shadow: 0 0 30px rgba(74, 222, 128, 0.5);
  }

  .overlay .subtitle {
    font-size: 15px;
    color: #888;
    margin-bottom: 28px;
  }

  .overlay .game-over-score {
    font-size: 20px;
    color: #e2e8f0;
    margin-bottom: 6px;
  }

  .overlay .new-best {
    font-size: 14px;
    color: #facc15;
    margin-bottom: 24px;
  }

  .btn {
    background: #4ade80;
    color: #0a0a0a;
    border: none;
    padding: 12px 36px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.1s, box-shadow 0.2s;
  }

  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
  }

  .btn:active { transform: scale(0.97); }

  .canvas-container {
    position: relative;
  }

  .controls-hint {
    font-size: 12px;
    color: #444;
    text-align: center;
    margin-top: 4px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <div class="score">SCORE: <span id="score">0</span></div>
    <div class="high-score">BEST: <span id="high-score">0</span></div>
  </div>
  <div class="canvas-container">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="start-screen">
      <h1>SNAKE</h1>
      <div class="subtitle">A classic reimagined</div>
      <button class="btn" id="start-btn">PLAY</button>
    </div>
    <div class="overlay hidden" id="death-screen">
      <h1 style="color:#ef4444; text-shadow: 0 0 30px rgba(239,68,68,0.5);">GAME OVER</h1>
      <div class="game-over-score" id="final-score"></div>
      <div class="new-best hidden" id="new-best">NEW HIGH SCORE!</div>
      <button class="btn" id="retry-btn">PLAY AGAIN</button>
    </div>
  </div>
  <div class="controls-hint">Arrow keys or WASD to move &middot; P to pause</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const COLS = 24, ROWS = 24;
const CELL = canvas.width / COLS;

const startScreen = document.getElementById('start-screen');
const deathScreen = document.getElementById('death-screen');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('high-score');
const finalScoreEl = document.getElementById('final-score');
const newBestEl = document.getElementById('new-best');

let snake, dir, nextDir, food, score, highScore, speed, gameLoop, paused, particles;

highScore = parseInt(localStorage.getItem('snake-hs') || '0');
highScoreEl.textContent = highScore;

function init() {
  const mid = Math.floor(COLS / 2);
  snake = [
    { x: mid, y: mid },
    { x: mid - 1, y: mid },
    { x: mid - 2, y: mid },
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  speed = 120;
  paused = false;
  particles = [];
  scoreEl.textContent = '0';
  spawnFood();
}

function spawnFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (occupied.has(`${pos.x},${pos.y}`));
  food = pos;
  food.pulse = 0;
}

function emitParticles(x, y) {
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
    const speed = 1.5 + Math.random() * 2.5;
    particles.push({
      x: x * CELL + CELL / 2,
      y: y * CELL + CELL / 2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      size: 2 + Math.random() * 3,
      color: Math.random() > 0.5 ? '#4ade80' : '#22d3ee',
    });
  }
}

function update() {
  if (paused) return;

  dir = { ...nextDir };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
  for (const seg of snake) {
    if (seg.x === head.x && seg.y === head.y) return die();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    emitParticles(food.x, food.y);
    spawnFood();
    if (speed > 60) speed = Math.max(60, speed - 2);
    clearInterval(gameLoop);
    gameLoop = setInterval(update, speed);
  } else {
    snake.pop();
  }
}

function die() {
  clearInterval(gameLoop);
  gameLoop = null;

  for (const seg of snake) emitParticles(seg.x, seg.y);

  const isNewBest = score > highScore;
  if (isNewBest) {
    highScore = score;
    localStorage.setItem('snake-hs', highScore);
    highScoreEl.textContent = highScore;
  }

  finalScoreEl.textContent = `Score: ${score}`;
  newBestEl.classList.toggle('hidden', !isNewBest);

  setTimeout(() => deathScreen.classList.remove('hidden'), 600);
}

function draw() {
  ctx.fillStyle = '#111118';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let x = 0; x < COLS; x++) {
    for (let y = 0; y < ROWS; y++) {
      if ((x + y) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.012)';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
  }

  if (food) {
    food.pulse = (food.pulse || 0) + 0.06;
    const glow = 0.4 + Math.sin(food.pulse) * 0.15;
    const size = CELL * (0.7 + Math.sin(food.pulse) * 0.08);
    const offset = (CELL - size) / 2;

    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 12 + Math.sin(food.pulse) * 4;
    ctx.fillStyle = `rgba(239, 68, 68, ${glow + 0.5})`;
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, size / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  for (let i = (snake ? snake.length : 0) - 1; i >= 0; i--) {
    const seg = snake[i];
    const t = i / snake.length;
    const r = CELL * 0.85;
    const offset = (CELL - r) / 2;

    if (i === 0) {
      ctx.shadowColor = '#4ade80';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#4ade80';
    } else {
      ctx.shadowBlur = 0;
      const green = Math.round(222 - t * 100);
      const blue = Math.round(128 - t * 60);
      ctx.fillStyle = `rgb(${Math.round(30 + t * 10)}, ${green}, ${blue})`;
    }

    const radius = 4;
    const x = seg.x * CELL + offset;
    const y = seg.y * CELL + offset;
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + r, y, x + r, y + r, radius);
    ctx.arcTo(x + r, y + r, x, y + r, radius);
    ctx.arcTo(x, y + r, x, y, radius);
    ctx.arcTo(x, y, x + r, y, radius);
    ctx.closePath();
    ctx.fill();

    if (i === 0) {
      ctx.shadowBlur = 0;
      const ex1 = { x: seg.x * CELL + CELL * 0.32, y: seg.y * CELL + CELL * 0.32 };
      const ex2 = { x: seg.x * CELL + CELL * 0.68, y: seg.y * CELL + CELL * 0.32 };
      if (dir.y === 1) { ex1.y = seg.y * CELL + CELL * 0.68; ex2.y = ex1.y; }
      if (dir.x === -1) { ex1.x = seg.x * CELL + CELL * 0.22; ex2.x = seg.x * CELL + CELL * 0.22; ex1.y = seg.y * CELL + CELL * 0.3; ex2.y = seg.y * CELL + CELL * 0.7; }
      if (dir.x === 1) { ex1.x = seg.x * CELL + CELL * 0.78; ex2.x = seg.x * CELL + CELL * 0.78; ex1.y = seg.y * CELL + CELL * 0.3; ex2.y = seg.y * CELL + CELL * 0.7; }
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath(); ctx.arc(ex1.x, ex1.y, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2.x, ex2.y, 2.2, 0, Math.PI * 2); ctx.fill();
    }
  }

  for (let i = (particles ? particles.length : 0) - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= 0.025;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (paused && gameLoop != null) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 28px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
  }

  requestAnimationFrame(draw);
}

function startGame() {
  startScreen.classList.add('hidden');
  deathScreen.classList.add('hidden');
  init();
  gameLoop = setInterval(update, speed);
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);

document.addEventListener('keydown', e => {
  const key = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(key)) {
    e.preventDefault();
  }

  if (!gameLoop) return;

  if (key === 'p' || key === 'P') {
    paused = !paused;
    return;
  }
  if (paused) return;

  switch (key) {
    case 'ArrowUp':    case 'w': case 'W': if (dir.y !== 1)  nextDir = { x: 0, y: -1 }; break;
    case 'ArrowDown':  case 's': case 'S': if (dir.y !== -1) nextDir = { x: 0, y: 1 };  break;
    case 'ArrowLeft':  case 'a': case 'A': if (dir.x !== 1)  nextDir = { x: -1, y: 0 }; break;
    case 'ArrowRight': case 'd': case 'D': if (dir.x !== -1) nextDir = { x: 1, y: 0 };  break;
  }
});

draw();
</script>
</body>
</html>
