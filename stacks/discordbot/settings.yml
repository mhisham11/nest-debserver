use_default_settings: true

server:
  # secret_key comes from SEARXNG_SECRET (searxng.env)
  limiter: false          # internal-only instance, no bot-detection/valkey needed
  image_proxy: false

search:
  safe_search: 1
  default_lang: auto
  formats:                # json is OFF by default in SearXNG; the bot needs it
    - html
    - json

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
